; Runaris Ghost — php.ini do runtime embutido (Windows / FrankenPHP)
; ponytail: só o que o app exige; o assistente valida as extensões no 1º acesso.
; Não edite aqui sem atualizar App\Services\RequirementsChecker.

extension_dir = "ext"

extension=bcmath
extension=curl
extension=fileinfo
extension=gd
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=xml
extension=zip
extension=tokenizer
extension=ctype

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 72M
max_file_uploads = 40
max_execution_time = 120

date.timezone = UTC
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
