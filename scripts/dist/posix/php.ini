; Runaris Ghost — php.ini do runtime embutido (macOS / Linux / FrankenPHP)
; ponytail: nas builds estáticas do FrankenPHP as extensões já vêm compiladas
; (pdo_sqlite, mbstring, openssl, tokenizer, xml, ctype, fileinfo, bcmath, gd,
; zip, intl). Aqui só entram limites — nada de extension_dir/extension, que no
; Windows apontariam para a pasta ext/ e aqui não existe.
; Não edite aqui sem atualizar App\Services\RequirementsChecker.

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 72M
max_file_uploads = 40
max_execution_time = 120

date.timezone = UTC
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
